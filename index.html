  :root{
    /* Brand-Farbpalette Mandy Heubach */
    --sky: #B0D2E2;
    --navy: #00324A;
    --lime: #8DB700;
    --forest: #036001;
    --grey: #B0B0B0;

    --bg: #F5FAFB;
    --bg-soft: #E1EEF2;
    --card: #FFFFFF;
    --ink: var(--navy);
    --ink-soft: #587480;
    --line: #D9E2E5;
    --sage: var(--lime);
    --sage-deep: var(--navy);
    --rose: var(--navy);
    --rose-soft: #E1EEF2;
    --sage-soft: #EAF2D2;
    --shadow: 0 20px 45px -25px rgba(0,50,74,0.35);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --font-display: 'Anton', 'Arial Narrow', sans-serif;
    --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-accent: 'Satisfy', cursive;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #EAF4F7 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #DCEAEF 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  #app{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Progress bar */
  .progress-wrap{
    padding: 22px 0 6px 0;
  }
  .progress-track{
    height: 6px;
    background: var(--bg-soft);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--sage), var(--sage-deep));
    border-radius: 99px;
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{
    margin-top: 8px;
    font-size: 12.5px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
  }

  main{
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 18px 0 40px 0;
  }

  .fade-in{
    animation: fadeIn .38s ease both;
  }
  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* Start screen */
  .brand{
    font-family: var(--font-display);
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--sage-deep);
  }
  .start-screen{
    text-align: left;
    padding-top: 6vh;
  }
  .start-mark{
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--sage-soft);
    display: flex; align-items:center; justify-content:center;
    margin-bottom: 26px;
  }
  .start-mark svg{ width: 22px; height: 22px; }
  .start-screen h1{
    font-family: var(--font-display);
    font-size: 40px;
    line-height: 1.05;
    font-weight: 400;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0 0 18px 0;
    color: var(--ink);
  }
  .start-screen h1 span{
    display: block;
    font-family: var(--font-accent);
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    font-size: 32px;
    color: var(--navy);
    margin-top: 4px;
  }
  .start-screen p{
    font-size: 16.5px;
    color: var(--ink-soft);
    margin: 0 0 10px 0;
    max-width: 46ch;
  }

  .question-eyebrow{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .08em;
    font-weight: 600;
    color: var(--rose);
    margin: 0 0 10px 0;
  }
  h2.question-title{
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 25px;
    line-height: 1.32;
    letter-spacing: 0.01em;
    margin: 0 0 8px 0;
    color: var(--ink);
  }
  .question-hint{
    font-size: 14.5px;
    color: var(--ink-soft);
    margin: 0 0 22px 0;
  }

  /* Buttons */
  .btn{
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 600;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    padding: 16px 26px;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{
    background: var(--lime);
    color: var(--navy);
    width: 100%;
    box-shadow: 0 12px 24px -12px rgba(141,183,0,0.55);
  }
  .btn-primary:disabled{
    background: #E1E4D6;
    color: #9AA091;
    box-shadow: none;
    cursor: not-allowed;
  }
  .btn-secondary{
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--line);
    width: 100%;

<body>
<div id="app"></div>

<script>
(function(){

  /* =========================================================
     STATE
  ========================================================= */
  var state = {
    screen: 'start',
    answers: {
      geschlecht: null,
      alter: null,
      groesse: null,
      gewicht: null,
      ziel: null,
      zielgewicht: null,
      koerperfettBekannt: null,
      koerperfett: null,
      arbeitsalltag: null,
      schritte: null,
      krafttraining: null,
      krafttrainingDauer: null,
      ausdauer: null,
      ausdauerDauer: null,
      weitereBewegung: null,
      mahlzeiten: null,
      sicherheit: []
    },
    resolvedWarnings: {},
    fieldError: null
  };

  var STEP_ORDER = [
    'geschlecht','alter','groesse','gewicht','ziel','zielgewicht',
    'koerperfett','arbeitsalltag','schritte','krafttraining',
    'krafttrainingDauer','ausdauer','ausdauerDauer','weitereBewegung',
    'mahlzeiten','sicherheit'
  ];

  function isApplicable(id, a){
    if(id === 'zielgewicht') return a.ziel === 'abnehmen' || a.ziel === 'aufbau' || a.ziel === 'recomp';
    if(id === 'krafttrainingDauer') return a.krafttraining !== null && a.krafttraining > 0;
    if(id === 'ausdauerDauer') return a.ausdauer !== null && a.ausdauer > 0;
    return true;
  }

  function visibleSteps(a){
    return STEP_ORDER.filter(function(id){ return isApplicable(id, a); });
  }

  function nextStepId(current, a){
    var idx = STEP_ORDER.indexOf(current);
    for(var i = idx+1; i < STEP_ORDER.length; i++){
      if(isApplicable(STEP_ORDER[i], a)) return STEP_ORDER[i];
    }
    return 'summary';
  }

  function prevStepId(current, a){
    var idx = STEP_ORDER.indexOf(current);
    for(var i = idx-1; i >= 0; i--){
      if(isApplicable(STEP_ORDER[i], a)) return STEP_ORDER[i];
    }
    return 'start';
  }

  function setAnswer(key, value){
    state.answers[key] = value;
    delete state.resolvedWarnings[key];
    state.fieldError = null;
  }

  function goTo(screen){
    state.screen = screen;
    state.fieldError = null;
    render();
    window.scrollTo(0,0);
  }

  function goNext(){
    var n = nextStepId(state.screen, state.answers);
    goTo(n);
  }
  function goBack(){
    if(STEP_ORDER.indexOf(state.screen) === -1){
      goTo('summary');
      return;
    }
    var p = prevStepId(state.screen, state.answers);
    goTo(p);
  }

  /* =========================================================
     PLAUSIBILITY CHECKS
  ========================================================= */
  function getWarnings(a){
    var w = [];
    if(a.alter !== null && (a.alter < 14 || a.alter > 100)){
      w.push({ id:'alter', text:'Dein Alter kommt uns ungewöhnlich vor.' });
    }
    if(a.groesse !== null && (a.groesse < 120 || a.groesse > 220)){
      w.push({ id:'groesse', text:'Deine Körpergröße kommt uns ungewöhnlich vor.' });
    }
    if(a.gewicht !== null && (a.gewicht < 35 || a.gewicht > 250)){
      w.push({ id:'gewicht', text:'Dein aktuelles Gewicht kommt uns ungewöhnlich vor.' });
    }
    if(a.zielgewicht !== null){
      if(a.zielgewicht < 35 || a.zielgewicht > 250){
        w.push({ id:'zielgewicht', text:'Dein Zielgewicht kommt uns ungewöhnlich vor.' });
      } else if(a.ziel === 'abnehmen' && a.zielgewicht >= a.gewicht){
        w.push({ id:'zielgewicht', text:'Dein Zielgewicht liegt nicht unter deinem aktuellen Gewicht, obwohl dein Ziel Abnehmen ist. Stimmt das so?' });
      } else if(a.ziel === 'aufbau' && a.zielgewicht < a.gewicht){
        w.push({ id:'zielgewicht', text:'Dein Zielgewicht liegt unter deinem aktuellen Gewicht, obwohl du Muskulatur aufbauen möchtest. Stimmt das so?' });
      }
    }
    if(a.schritte !== null && (a.schritte < 0 || a.schritte > 40000)){
      w.push({ id:'schritte', text:'Deine Schrittzahl kommt uns ungewöhnlich vor.' });
    }
    if(a.arbeitsalltag === 'aktiv' && a.schritte !== null && a.schritte < 5000){
      w.push({ id:'schritte', text:'Ein körperlich aktiver Arbeitsalltag zusammen mit unter 5.000 Schritten ist eine ungewöhnliche Kombination. Stimmt das so?' });
    }
    if(a.krafttrainingDauer !== null && (a.krafttrainingDauer < 10 || a.krafttrainingDauer > 180)){
      w.push({ id:'krafttrainingDauer', text:'Die Dauer deiner Krafttrainingseinheiten kommt uns ungewöhnlich vor.' });
    }
    if(a.ausdauerDauer !== null && (a.ausdauerDauer < 10 || a.ausdauerDauer > 300)){
      w.push({ id:'ausdauerDauer', text:'Die Dauer deiner Ausdauereinheiten kommt uns ungewöhnlich vor.' });
    }
    return w.filter(function(item){ return !state.resolvedWarnings[item.id]; });
  }

  /* =========================================================
     CALCULATION (deterministisch, intern – keine Ausgabe an Nutzer)
  ========================================================= */
  function round10(n){ return Math.round(n/10)*10; }
  function round5(n){ return Math.round(n/5)*5; }
  function round100(n){ return Math.round(n/100)*100; }

  /* ---------------------------------------------------------
     WICHTIG: Alle mit "OFFEN:" markierten Stellen enthalten
     bewusst KEINE selbst entwickelte fachliche Entscheidungslogik.
     Es werden neutrale, unveränderliche Platzhalterwerte verwendet,
     bis die jeweilige Regel gemeinsam verbindlich festgelegt wurde.
     Die Platzhalter sind NICHT von den Nutzereingaben abhängig
     (kein Punktesystem, keine Gewichtung, keine Schwellenwerte).
  --------------------------------------------------------- */

  function hasMedicalFlag(a){
    return a.sicherheit && a.sicherheit.length > 0 && a.sicherheit.indexOf('nichts') === -1;
  }
  function hasEatingDisorderFlag(a){
    return a.sicherheit && a.sicherheit.indexOf('essstoerung') !== -1;
  }

  function computeResults(a){
    // Grundumsatz: Mifflin-St-Jeor-Formel, exakt wie in der Wissensbasis definiert.
    var bmr = a.geschlecht === 'frau'
      ? (10*a.gewicht + 6.25*a.groesse - 5*a.alter - 161)
      : (10*a.gewicht + 6.25*a.groesse - 5*a.alter + 5);
    bmr = round10(bmr);

    // ---------------------------------------------------------------
    // Aktivitätsbewertung nach der verbindlich vorgegebenen Produktlogik:
    // Stufe 1: Basis aus Arbeitsalltag + Schritten (feste Tabelle, 6 benannte
    //          Stufen: sehr gering(1) / gering bis mäßig(2) / mäßig(3) /
    //          mäßig bis höher(4) / höher(5) / hoch(6)).
    // Stufe 2: Krafttraining erhöht die Stufe angemessen, gewichtet nach Dauer.
    // Stufe 3: Ausdauertraining erhöht zusätzlich, ebenfalls dauer-gewichtet.
    // Stufe 4: Weitere Bewegung erhöht nur leicht (Doppelzählung vermeiden).
    // Priorität: Arbeitsalltag > Schritte > Krafttraining > Ausdauertraining >
    //            weitere Bewegung. Training ergänzt die Alltagsaktivität,
    //            ersetzt sie aber nicht (Gesamtstufe bleibt auf 1–6 gedeckelt).
    // Die resultierende Stufe wird anschließend linear auf den in der
    // Wissensbasis vorgegebenen Gesamtbereich 1,20–1,75 abgebildet.
    // Diese Werte (Stufe, Faktor) sind rein intern und werden dem Nutzer nie angezeigt.
    // ---------------------------------------------------------------
    function baseStufe(arbeitsalltag, schritte){
      if(arbeitsalltag === 'sitzend'){
        if(schritte < 5000) return 1;
        if(schritte < 7000) return 2;
        if(schritte < 10000) return 3;
        return 4;
      }
      if(arbeitsalltag === 'gemischt'){
        if(schritte < 5000) return 2;
        if(schritte < 7000) return 3;
        if(schritte < 10000) return 4;
        return 5;
      }
      // aktiv — bei <5000 Schritten ungewöhnliche Kombination (siehe Plausibilitätsprüfung),
      // als neutraler Basiswert dient hier "mäßig".
      if(schritte < 5000) return 3;
      if(schritte < 7000) return 4;
      if(schritte < 10000) return 5;
      return 6;
    }
    // Kurze Einheiten (<30 Min.) wirken schwächer, ab 30 Min. voller Effekt,
    // sehr lange Einheiten erzeugen keinen zusätzlichen linearen Bonus.
    function durationFactor(minutes){
      if(!minutes || minutes < 30) return 0.5;
      return 1.0;
    }
    function krafttrainingBoost(count, minutes){
      var base;
      if(!count || count === 0) base = 0;
      else if(count <= 2) base = 0.3;
      else if(count === 3) base = 0.6;
      else if(count === 4) base = 0.8;
      else base = 1.0;
      return base * durationFactor(minutes);
    }
    function ausdauerBoost(count, minutes){
      var base;
      if(!count || count === 0) base = 0;
      else if(count >= 4 || (minutes && minutes >= 90)) base = 0.8;
      else if(count >= 2) base = 0.5;
      else base = 0.2;
      return base * durationFactor(minutes);
    }

    var stufe = baseStufe(a.arbeitsalltag, a.schritte);
    stufe += krafttrainingBoost(a.krafttraining, a.krafttrainingDauer);
    stufe += ausdauerBoost(a.ausdauer, a.ausdauerDauer);
    if(a.weitereBewegung && a.weitereBewegung !== 'nein' && a.weitereBewegung.trim().length > 3){
      stufe += 0.2; // bewusst klein, um Doppelzählung mit bereits erfassten Schritten zu vermeiden
    }
    stufe = Math.min(6, Math.max(1, stufe));

    var factor = 1.20 + ((stufe-1)/5) * (1.75-1.20);
    factor = Math.round(factor*100)/100;
    var maintenance = round10(bmr * factor);
    var maintenanceRange = [maintenance-100, maintenance+100];

    if(hasMedicalFlag(a)){
      return {
        safety: true,
        eatingDisorder: hasEatingDisorderFlag(a),
        bmr: bmr,
        maintenance: maintenance,
        maintenanceRange: maintenanceRange
      };
    }

    // Erkennt, ob "Fett verlieren & Muskulatur aufbauen" ohne Krafttraining gewählt wurde.
    // In diesem Fall wird das Ziel NICHT als Körperrekomposition behandelt, sondern wie
    // ein vorsichtiger Fettverlust/Muskelerhalt mit Fokus auf den Aufbau eines Trainingsreizes.
    var recompOhneTraining = (a.ziel === 'recomp' && a.krafttraining === 0);

    var targetCalories;
    var intendedTarget; // Zielwert vor den Sicherheits-Untergrenzen, für Punkt 6 (Kalorienziel vs. Bewegung)

    if(a.ziel === 'halten'){
      targetCalories = maintenance;
      intendedTarget = maintenance;
    } else if(a.ziel === 'aufbau'){
      // OFFEN: Auswahl des Überschusses innerhalb von 150–250 kcal ist nicht festgelegt.
      // Platzhalter (Mittelwert des Bereichs):
      var surplus = 200;
      targetCalories = maintenance + surplus;
      intendedTarget = targetCalories;
    } else if(a.ziel === 'abnehmen'){
      // Defizit-Regel "Abnehmen" (von Mandy bestätigt, 05.11.2026):
      //   Abstand zum Zielgewicht bis 5 kg      -> 200 kcal (klein)
      //   Abstand über 5 bis 15 kg              -> 300 kcal (klein)
      //   Abstand über 15 kg                    -> 375 kcal (moderat)
      //   500 kcal nur bei BMI ab 30 (Obergrenze; wird von den Stufen oben aktuell nicht erreicht)
      //   Hoher Trainingsumfang (Kraft + Ausdauer ab 4 Einheiten/Woche) -> höchstens 300 kcal
      // OFFEN: "Einheiten" = Summe aus Kraft- und Ausdauertraining ist eine Annahme, bitte bestätigen.
      var goalW = a.zielgewicht || a.gewicht;
      var gap = a.gewicht - goalW;
      var bmiNow = a.gewicht / Math.pow(a.groesse/100, 2);
      var deficit;
      if(gap <= 5) deficit = 200;
      else if(gap <= 15) deficit = 300;
      else deficit = 375;
      var sessions = (a.krafttraining || 0) + (a.ausdauer || 0);
      if(sessions >= 4) deficit = Math.min(deficit, 300);
      deficit = Math.min(deficit, bmiNow >= 30 ? 500 : 450);
      intendedTarget = maintenance - deficit;
      targetCalories = intendedTarget;
    } else if(a.ziel === 'recomp'){
      // OFFEN: Defizit-Regel für "Fett verlieren & Muskulatur aufbauen" ist noch nicht festgelegt.
      // Platzhalter: kleines Defizit (Mittelwert 200–300 kcal).
      var deficitR = 250;
      intendedTarget = maintenance - deficitR;
      targetCalories = intendedTarget;
    }

    var minCalories = a.geschlecht === 'frau' ? 1200 : 1500;
    targetCalories = Math.max(targetCalories, minCalories);
    targetCalories = Math.max(targetCalories, bmr);
    targetCalories = round10(targetCalories);

    // Punkt 6: Wenn die Sicherheits-Untergrenzen eine weitere Reduktion verhindern,
    // ist "noch weniger essen" nicht die Lösung – dann soll die Bewegungsempfehlung
    // stärker im Vordergrund stehen (siehe hc-note in renderResults).
    var calorieFloorHit = (a.ziel === 'abnehmen' || a.ziel === 'recomp') && targetCalories > intendedTarget;

    // Eiweiß: Basis (Ziel- oder Körpergewicht) und Bereich je Ziel exakt nach Wissensbasis.
    // OFFEN: der genaue Schwellenwert für "höheren Körperfettanteil" (§5, Berechnungsregeln),
    // ab dem statt Körpergewicht mit Zielgewicht gerechnet werden soll, ist nicht festgelegt.
    // Deshalb wird diese Umschaltung aktuell NICHT angewendet.
    var proteinBasis, proteinRange;
    if(a.ziel === 'abnehmen'){
      proteinBasis = a.zielgewicht || a.gewicht;
      proteinRange = (a.krafttraining > 0) ? [1.6, 2.0] : [1.4, 1.6];
    } else if(a.ziel === 'halten'){
      proteinBasis = a.gewicht;
      proteinRange = [1.2, 1.8];
    } else if(a.ziel === 'recomp'){
      // OFFEN: Eiweißbereich für dieses Ziel ist fachlich noch nicht festgelegt.
      // Solange kein Krafttraining stattfindet, wird konsistent zur Coaching-Logik
      // (Punkt 2) der gleiche Bereich wie "Abnehmen ohne Krafttraining" verwendet.
      // Sobald Krafttraining vorhanden ist, der etwas höhere Platzhalter-Bereich.
      proteinBasis = a.zielgewicht || a.gewicht;
      proteinRange = recompOhneTraining ? [1.4, 1.6] : [1.6, 2.0];
    } else {
      proteinBasis = a.gewicht;
      proteinRange = [1.6, 2.2];
    }
    // OFFEN: welcher konkrete Wert innerhalb des Eiweißbereichs verwendet werden soll
    // (unterer / mittlerer / oberer Bereich), ist nicht festgelegt. Platzhalter: Mittelwert.
    var proteinFactor = proteinRange[0] + 0.5*(proteinRange[1]-proteinRange[0]);
    var proteinGrams = round5(proteinBasis * proteinFactor);

    var fatBasis = (a.ziel === 'halten') ? a.gewicht : (a.zielgewicht || a.gewicht);
    var fatRange = (a.geschlecht === 'frau') ? [0.8, 1.0] : [0.7, 0.9];
    // OFFEN: welcher konkrete Wert innerhalb des Fettbereichs verwendet werden soll, ist
    // nicht festgelegt (Wissensbasis sagt nur "nicht unnötig niedrig wählen").
    // Platzhalter: Mittelwert.
    var fatFactor = fatRange[0] + 0.5*(fatRange[1]-fatRange[0]);
    var fatGrams = round5(fatBasis * fatFactor);

    // Kohlenhydrate: direkt aus den verbleibenden Kalorien, exakt nach Wissensbasis §7.
    var remaining = targetCalories - (proteinGrams*4) - (fatGrams*9);
    var carbGrams = Math.max(0, round5(remaining/4));

    // Ballaststoffe: "mindestens 30 g" ist der explizit genannte Wert aus der Wissensbasis.
    var fiberGrams = 30;

    // Trinkmenge: 40 ml/kg bei Abnehmen bzw. eiweißreicher Ernährung, sonst 35 ml/kg –
    // beides wörtlich aus der Wissensbasis (§9). "Recomp" ist ebenfalls eiweißreich, daher 40.
    var mlPerKg = (a.ziel === 'abnehmen' || a.ziel === 'recomp') ? 40 : 35;
    var waterMl = round100(a.gewicht * mlPerKg);
    var waterLiters = (waterMl/1000).toFixed(1).replace('.', ',');

    // Eiweiß pro Mahlzeit: Tagesmenge / Mahlzeitenzahl, gerundet auf 5 g (Coachinglogik §3).
    var mealsCount = (a.mahlzeiten === '5plus') ? 5 : parseInt(a.mahlzeiten, 10);
    var proteinPerMeal = round5(proteinGrams / mealsCount);

    var hints = buildHints(a, { proteinPerMeal: proteinPerMeal });

    return {
      safety: false,
      bmr: bmr,
      maintenance: maintenance,
      maintenanceRange: maintenanceRange,
      calorieRange: [targetCalories-100, targetCalories+100],
      calorieStart: targetCalories,
      calorieFloorHit: calorieFloorHit,
      proteinGrams: proteinGrams,
      fatGrams: fatGrams,
      carbGrams: carbGrams,
      fiberGrams: fiberGrams,
      waterLiters: waterLiters,
      waterMl: waterMl,
      proteinPerMeal: proteinPerMeal,
      trainingActive: (a.krafttraining > 0 || a.ausdauer > 0),
      mealsAreTwo: a.mahlzeiten === '2',
      recompOhneTraining: recompOhneTraining,
      hints: hints
    };
  }

  function buildHints(a, extra){
    // Priorisierung gemäß Coaching-Vorgabe:
    // 1) Widerspruch zwischen Ziel und Verhalten (z. B. Muskelaufbau/Recomp ohne Krafttraining)
    // 2) sehr geringe Alltagsbewegung (Schritte < 5.000)
    // 3) hoher Trainingsumfang (Krafttraining ≥ 3× / Woche, wörtlich aus Coachinglogik §5.2)
    // 4) problematische Eiweißverteilung bei nur zwei Mahlzeiten
    // 5) weitere individuelle Auffälligkeiten
    // Es werden maximal drei Hinweise angezeigt (siehe Ende der Funktion).
    var candidates = [];

    if(a.ziel === 'recomp' && a.krafttraining === 0){
      candidates.push({ p:100, text:'Dein Wunsch ist, Fett zu verlieren und gleichzeitig Muskulatur aufzubauen. Aktuell fehlt dafür allerdings regelmäßiges Krafttraining. Ohne einen passenden Trainingsreiz lässt sich gezielter Muskelaufbau nicht sinnvoll planen. Der erste Schwerpunkt liegt deshalb auf Fettverlust beziehungsweise Muskelerhalt und darauf, einen regelmäßigen Kraftreiz aufzubauen. Zwei kurze Krafttrainingseinheiten pro Woche wären ein guter Anfang, das ist aber ein Vorschlag und keine Pflicht.' });
    }
    if(a.ziel === 'aufbau' && a.krafttraining === 0){
      candidates.push({ p:100, text:'Du möchtest Muskulatur aufbauen, trainierst aktuell aber nicht mit Gewichten. Ohne einen Kraftreiz lässt sich gezielter Muskelaufbau kaum erreichen. Zwei bis drei Krafteinheiten pro Woche wären hier ein sinnvoller Einstieg.' });
    }

    if(a.schritte !== null && a.schritte < 5000){
      // Zwei Ebenen: (1) persönliche Einordnung der Angabe, (2) kurzer allgemeiner
      // gesundheitlicher Orientierungsrahmen (WHO-Bewegungsempfehlung für Erwachsene,
      // sinngemäß: mind. 150 Min. moderate Aktivität/Woche + kräftigende Bewegung an
      // mind. 2 Tagen/Woche + Sitzphasen unterbrechen). 10.000 Schritte werden bewusst
      // NICHT als zwingende gesundheitliche Mindestgrenze dargestellt.
      var stepHint = 'Mit rund ' + a.schritte.toLocaleString('de-DE') + ' Schritten pro Tag ist deine Alltagsbewegung aktuell sehr niedrig. Für einen gesunden Bewegungsalltag geht es nicht darum, zwanghaft 10.000 Schritte zu erreichen, sondern regelmäßig aktiv zu sein und lange Sitzphasen zu unterbrechen. Als erster realistischer Schritt wäre es sinnvoll, deinen Durchschnitt zunächst um etwa 1.000 bis 2.000 Schritte pro Tag zu erhöhen.';
      if((a.ziel === 'aufbau' || a.ziel === 'recomp') && a.krafttraining === 0){
        stepHint += ' Für gezielten Muskelaufbau braucht dein Körper regelmäßige kräftigende Belastung. Als allgemeine gesundheitliche Orientierung werden kräftigende Aktivitäten an mindestens zwei Tagen pro Woche empfohlen. Bei aktuell keinem Krafttraining wäre deshalb genau das ein wichtiger nächster Schritt.';
      }
      candidates.push({ p:90, text: stepHint });
    }

    if(a.krafttraining >= 3){
      candidates.push({ p:80, text:'Bei deinem regelmäßigen Krafttraining sind ausreichend Eiweiß, Erholung und ein nicht zu großes Kaloriendefizit besonders wichtig.' });
    }

    if(a.mahlzeiten === '2'){
      candidates.push({ p:70, text:'Mit zwei Mahlzeiten müsstest du pro Mahlzeit ungefähr ' + extra.proteinPerMeal + ' g Eiweiß erreichen. Das ist möglich, für viele Menschen im Alltag aber recht viel. Drei ausgewogene Hauptmahlzeiten machen die Eiweißverteilung meist deutlich leichter.' });
    }

    if(a.schritte !== null && a.schritte >= 5000 && a.schritte < 7000){
      candidates.push({ p:40, text:'Deine Schrittzahl ist eine solide Basis, die sich noch ausbauen lässt. Ein realistisches nächstes Ziel wären im Schnitt etwa 7.000 bis 8.000 Schritte.' });
    } else if(a.schritte !== null && a.schritte > 10000){
      candidates.push({ p:30, text:'Du bewegst dich im Alltag schon richtig viel, das ist bei deinen Werten bereits berücksichtigt. Zusätzliches Training musst du dir deswegen nicht auferlegen.' });
    }

    if(a.ziel === 'abnehmen' && a.krafttraining === 0){
      candidates.push({ p:20, text:'Aktuell trainierst du nicht mit Gewichten. Zwei kurze Krafteinheiten pro Woche können dir helfen, beim Abnehmen mehr von deiner Muskulatur zu erhalten. Das ist ein Vorschlag, keine Pflicht.' });
    }

    candidates.push({ p:1, text:'Beurteile deinen Fortschritt am besten über zwei bis drei Wochen im Schnitt und nicht anhand einzelner Tage auf der Waage.' });

    candidates.sort(function(x,y){ return y.p - x.p; });
    return candidates.slice(0,3).map(function(c){ return c.text; });
  }

  function el(html){
    var d = document.createElement('div');
    d.innerHTML = html;
    return d.firstElementChild;
  }

  function progressBar(){
    var vis = visibleSteps(state.answers);
    var idx = vis.indexOf(state.screen);
    if(idx === -1) return '';
    var total = vis.length;
    var current = idx+1;
    var pct = Math.round((current/total)*100);
    return '' +
      '<div class="progress-wrap">' +
        '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
        '<div class="progress-label">Schritt '+current+' von '+total+'</div>' +
      '</div>';
  }

  function navFooter(nextEnabled, opts){
    opts = opts || {};
    var backHtml = state.screen === STEP_ORDER[0]
      ? '<span></span>'
      : '<button class="back-link" data-action="back">← Zurück</button>';
    var label = opts.label || 'Weiter';
    return '' +
      '<div class="nav-footer">' +
        backHtml +
        '<button class="btn btn-primary" data-action="next" '+(nextEnabled ? '' : 'disabled')+' style="flex:1">'+label+'</button>' +
      '</div>';
  }

          '<h1>Kalorienklar<span>mit Mandy</span></h1>' +
          '<p>Herzlich willkommen bei Kalorienklar mit Mandy.</p>' +
          '<p>Ich begleite dich Schritt für Schritt durch deine persönliche Berechnung. Das dauert ungefähr zwei Minuten.</p>' +
          '<p>Ich stelle dir immer nur eine Frage.</p>' +

            '<button class="btn btn-primary" data-action="start">Berechnung starten</button>' +
          '</div>' +

  function questionShell(eyebrow, title, hint, bodyHtml, nextEnabled, opts){

          (state.fieldError ? '<p class="field-error">'+state.fieldError+'</p>' : '') +
          navFooter(nextEnabled, opts) +
        '</div>' +
      '</main>';

    groesse: 'Größe',
    gewicht: 'Gewicht',
    ziel: 'Ziel',
    zielgewicht: 'Zielgewicht',
    koerperfett: 'Körperfettanteil',
    arbeitsalltag: 'Arbeitsalltag',
    schritte: 'Schritte',
    krafttraining: 'Krafttraining',
    krafttrainingDauer: 'Dauer Krafttraining',
    ausdauer: 'Ausdauertraining',
    ausdauerDauer: 'Dauer Ausdauer',
    weitereBewegung: 'Weitere Bewegung',
    mahlzeiten: 'Mahlzeiten',
    sicherheit: 'Sicherheitsabfrage'
  };

  function formatAnswer(key, a){
    switch(key){
      case 'geschlecht': return a.geschlecht === 'frau' ? 'Frau' : 'Mann';
      case 'alter': return a.alter + ' Jahre';
      case 'groesse': return a.groesse + ' cm';
      case 'gewicht': return a.gewicht + ' kg';
      case 'ziel': return a.ziel === 'abnehmen' ? 'Abnehmen' : (a.ziel === 'halten' ? 'Gewicht halten' : (a.ziel === 'recomp' ? 'Fett verlieren & Muskulatur aufbauen' : 'Muskulatur aufbauen'));
      case 'zielgewicht': return a.zielgewicht ? a.zielgewicht + ' kg' : null;
      case 'koerperfett': return a.koerperfettBekannt ? (a.koerperfett!==null ? a.koerperfett+' %' : null) : 'nicht angegeben';
      case 'arbeitsalltag': return {sitzend:'Überwiegend sitzend',gemischt:'Gemischt',aktiv:'Körperlich aktiv'}[a.arbeitsalltag];
      case 'schritte': return a.schritte !== null ? a.schritte.toLocaleString('de-DE') : null;
      case 'krafttraining': return a.krafttraining !== null ? (a.krafttraining === 0 ? 'Gar nicht' : a.krafttraining+'× pro Woche') : null;
      case 'ausdauer': return a.ausdauer !== null ? (a.ausdauer === 0 ? 'Gar nicht' : a.ausdauer+'× pro Woche') : null;
      case 'weitereBewegung': return (a.weitereBewegung && a.weitereBewegung !== 'nein') ? a.weitereBewegung : 'Keine Angabe';
      case 'mahlzeiten': return a.mahlzeiten === '5plus' ? '5 oder mehr' : a.mahlzeiten;
      case 'sicherheit': return a.sicherheit.length ? a.sicherheit.map(function(v){ return SICHERHEIT_OPTS.filter(function(o){return o.v===v;})[0].l; }).join(', ') : null;
      default: return null;
    }
  }

  function renderSummary(){
    var a = state.answers;
    var rows = STEP_ORDER.filter(function(id){ return isApplicable(id, a); }).map(function(id){
      var val = formatAnswer(id, a);
      if(!val) return '';
      return '<div class="summary-row">' +
        '<span class="s-label">'+STEP_LABELS[id]+'</span>' +
        '<span style="display:flex;align-items:center">' +
          '<span class="s-value">'+val+'</span>' +
          '<button class="change-btn" data-action="edit" data-step="'+id+'">Ändern</button>' +
        '</span>' +
      '</div>';
    }).join('');

    var body = '' +
      '<p class="question-eyebrow">Deine Angaben</p>' +
      '<div class="summary-card">'+rows+'</div>' +
      '<p class="confirm-question">Sind diese Angaben vollständig und korrekt?</p>' +

    return progressBar() + '<main><div class="fade-in">' + body + '</div></main>';

    var yazio = '' +

    // Erste Schritte (höchstens drei), abgeleitet aus bereits vorhandenen Hinweisregeln.

      firstSteps.push('Erhöhe deinen Schnitt um etwa 1.000 bis 2.000 Schritte pro Tag, zum Beispiel mit einem Spaziergang nach dem Abendessen.');
    } else if(a.schritte !== null && a.schritte >= 5000 && a.schritte < 7000){
      firstSteps.push('Steigere deinen Schnitt in Richtung 7.000 bis 8.000 Schritte pro Tag.');

    if(a.krafttraining === 0 && (a.ziel === 'abnehmen' || a.ziel === 'recomp' || a.ziel === 'aufbau')){
      firstSteps.push('Starte nach Möglichkeit mit zwei kurzen Krafttrainingseinheiten pro Woche. Das ist eine Empfehlung, keine Pflicht.');

    firstSteps = firstSteps.slice(0,3);
    var firstStepsHtml = '<div class="section-title">Deine ersten Schritte</div>' +

    lastRules = rules;

  /* =========================================================
     MAIN RENDER
  ========================================================= */
  var lastResults = null;
  var lastRules = [];


  /* =========================================================
     BILD-EXPORT (läuft komplett im Browser, nichts wird gesendet)
  ========================================================= */
  function wrapLines(ctx, text, maxW){
    var words = text.split(' '), lines = [], line = '';
    words.forEach(function(w){
      var t = line ? line + ' ' + w : w;
      if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; }
      else line = t;
    });
    if(line) lines.push(line);
    return lines;
  }
  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function saveResultImage(btn){
    if(!lastResults || lastResults.safety) return;
    var r = lastResults;
    var rules = lastRules.slice();
    var original = btn ? btn.textContent : '';
    if(btn){ btn.textContent = 'Bild wird erstellt …'; btn.disabled = true; }

    var fontsReady = (document.fonts && document.fonts.load) ? Promise.all([
      document.fonts.load('64px Anton'),
      document.fonts.load('700 26px "DM Sans"'),
      document.fonts.load('400 30px "DM Sans"'),
      document.fonts.load('52px Satisfy')
    ]).catch(function(){}) : Promise.resolve();

    fontsReady.then(function(){
      var W = 1080, PAD = 60, INNER = W - 2*PAD;
      var NAVY = '#00324A', LIME = '#8DB700', BG = '#F5FAFB', LINE = '#D9E2E5', SOFT = '#587480';
      var BODY = '"DM Sans", Arial, sans-serif', DISPLAY = 'Anton, "Arial Narrow", sans-serif', ACCENT = 'Satisfy, cursive';

      // Höhe der Regelliste vorab bestimmen
      var tmp = document.createElement('canvas').getContext('2d');
      tmp.font = '400 30px ' + BODY;
      var ruleBlocks = rules.map(function(t, i){
        return wrapLines(tmp, t, INNER - 70);
      });
      var rulesH = ruleBlocks.reduce(function(sum, lines){ return sum + lines.length*44 + 26; }, 0);

      var metricsTop = 640, cardH = 190, gap = 24;
      var rulesTop = metricsTop + 3*cardH + 2*gap + 90;
      var H = rulesTop + 70 + rulesH + 150;

      var cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
      ctx.textBaseline = 'alphabetic';

      // Kopf
      ctx.fillStyle = NAVY;
      ctx.font = '64px ' + DISPLAY;
      ctx.fillText('KALORIENKLAR', PAD, 130);
      ctx.font = '56px ' + ACCENT;
      ctx.fillStyle = LIME;
      ctx.fillText('mit Mandy', PAD, 196);

      // Hero
      var heroY = 250, heroH = 340;
      var g = ctx.createLinearGradient(PAD, heroY, PAD+INNER, heroY+heroH);
      g.addColorStop(0, LIME); g.addColorStop(1, NAVY);
      ctx.fillStyle = g; roundRect(ctx, PAD, heroY, INNER, heroH, 36); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 26px ' + BODY;
      ctx.fillText('DEIN STARTWERT', PAD+48, heroY+70);
      ctx.font = '130px ' + DISPLAY;
      var kcalTxt = String(r.calorieStart);
      ctx.fillText(kcalTxt, PAD+48, heroY+210);
      var kw = ctx.measureText(kcalTxt).width;
      ctx.font = '600 38px ' + BODY;
      ctx.fillText('kcal / Tag', PAD+48+kw+20, heroY+210);
      ctx.font = '400 30px ' + BODY;
      ctx.fillText('Kalorienbereich: ' + r.calorieRange[0] + ' – ' + r.calorieRange[1] + ' kcal', PAD+48, heroY+280);

      // Karten
      function card(x, y, w, label, value, unit){
        ctx.fillStyle = '#FFFFFF'; roundRect(ctx, x, y, w, cardH, 28); ctx.fill();
        ctx.strokeStyle = LINE; ctx.lineWidth = 2; roundRect(ctx, x, y, w, cardH, 28); ctx.stroke();
        ctx.fillStyle = SOFT; ctx.font = '700 22px ' + BODY;
        ctx.fillText(label.toUpperCase(), x+32, y+56);
        ctx.fillStyle = NAVY; ctx.font = '72px ' + DISPLAY;
        ctx.fillText(value, x+32, y+142);
        var vw = ctx.measureText(value).width;
        ctx.fillStyle = SOFT; ctx.font = '600 30px ' + BODY;
        ctx.fillText(unit, x+32+vw+14, y+142);
      }
      var cw = (INNER - gap) / 2, x1 = PAD, x2 = PAD + cw + gap;
      var y1 = metricsTop, y2 = y1 + cardH + gap, y3 = y2 + cardH + gap;
      card(x1, y1, cw, 'Eiweiß', String(r.proteinGrams), 'g / Tag');
      card(x2, y1, cw, 'Fett', String(r.fatGrams), 'g / Tag');
      card(x1, y2, cw, 'Kohlenhydrate', String(r.carbGrams), 'g / Tag');
      card(x2, y2, cw, 'Ballaststoffe', String(r.fiberGrams), 'g / Tag');
      card(x1, y3, cw, 'Trinkmenge', String(r.waterLiters), 'Liter / Tag');
      card(x2, y3, cw, 'Eiweiß pro Mahlzeit', 'ca. ' + r.proteinPerMeal, 'g');

      // Startregeln
      var y = rulesTop;
      ctx.fillStyle = NAVY; ctx.font = '44px ' + DISPLAY;
      ctx.fillText('DEINE WICHTIGSTEN STARTREGELN', PAD, y);
      y += 60;
      ruleBlocks.forEach(function(lines, i){
        ctx.fillStyle = LIME; ctx.font = '700 30px ' + BODY;
        ctx.fillText((i+1) + '.', PAD, y+30);
        ctx.fillStyle = NAVY; ctx.font = '400 30px ' + BODY;
        lines.forEach(function(l, k){ ctx.fillText(l, PAD+70, y+30 + k*44); });
        y += lines.length*44 + 26;
      });

      // Fuß
      ctx.fillStyle = SOFT; ctx.font = '400 24px ' + BODY;
      ctx.fillText('Kalorienklar mit Mandy · persönliche Orientierung, kein medizinischer Rat', PAD, H-60);

      cv.toBlob(function(blob){
        if(btn){ btn.textContent = original; btn.disabled = false; }
        if(!blob) return;
        var file;
        try { file = new File([blob], 'kalorienklar-startwerte.png', {type:'image/png'}); } catch(e){ file = null; }
        if(file && navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
          navigator.share({files:[file], title:'Meine Startwerte'}).catch(function(){});
        } else {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url; a.download = 'kalorienklar-startwerte.png';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
        }
      }, 'image/png');
    });
  }

  function render(){
    var app = document.getElementById('app');
    var html;
    if(state.screen === 'start'){
      html = renderStart();
    } else if(STEP_RENDERERS[state.screen]){
      html = STEP_RENDERERS[state.screen]();
    } else if(state.screen === 'summary'){
      html = renderSummary();
    } else if(state.screen === 'warnings'){
      html = renderWarnings();
    } else if(state.screen === 'results'){
      lastResults = lastResults || computeResults(state.answers);
      html = renderResults(lastResults);
    } else if(state.screen === 'safety'){
      lastResults = lastResults || computeResults(state.answers);
      html = renderSafetyResults(lastResults);
    } else {
      html = renderStart();
    }
    app.innerHTML = '<div>' + html + '</div><footer class="app-foot">Kalorienklar mit Mandy · deine persönliche Orientierung, kein medizinischer Rat<br><a href="https://mandy-heubach.de/impressum" target="_blank" rel="noopener">Impressum</a> · <a href="https://mandy-heubach.de/datenschutz" target="_blank" rel="noopener">Datenschutz</a></footer>';
    bindNumberInputs();
  }

  function bindNumberInputs(){
    ['alter','groesse','gewicht','zielgewicht','koerperfett','schritte','krafttrainingDauer','ausdauerDauer'].forEach(function(key){
      var input = document.getElementById('field-'+key);
      if(!input) return;
      input.addEventListener('input', function(){
        var v = input.value === '' ? null : parseFloat(input.value);
        setAnswer(key, v);
        refreshNextButton();
      });
      input.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); handleNext(); }
      });
    });
    var freeText = document.getElementById('field-weitereBewegung');
    if(freeText){
      freeText.addEventListener('input', function(){
        setAnswer('weitereBewegung', freeText.value);
      });
    }
  }

  function refreshNextButton(){
    // simplest robust approach: full re-render preserves focus loss, so instead
    // we just toggle disabled state directly without full re-render for number fields.
    var btn = document.querySelector('[data-action="next"]');
    if(!btn) return;
    var enabled = isCurrentStepValid();
    btn.disabled = !enabled;
  }

  function isCurrentStepValid(){
    var a = state.answers;
    switch(state.screen){
      case 'geschlecht': return !!a.geschlecht;
      case 'alter': return a.alter !== null && a.alter > 0;
      case 'groesse': return a.groesse !== null && a.groesse > 0;
      case 'gewicht': return a.gewicht !== null && a.gewicht > 0;
      case 'ziel': return !!a.ziel;
      case 'zielgewicht': return a.zielgewicht !== null && a.zielgewicht > 0;
      case 'koerperfett': return a.koerperfettBekannt !== null && (a.koerperfettBekannt === false || (a.koerperfett !== null));
      case 'arbeitsalltag': return !!a.arbeitsalltag;
      case 'schritte': return a.schritte !== null && a.schritte >= 0;
      case 'krafttraining': return a.krafttraining !== null;
      case 'krafttrainingDauer': return a.krafttrainingDauer !== null && a.krafttrainingDauer > 0;
      case 'ausdauer': return a.ausdauer !== null;
      case 'ausdauerDauer': return a.ausdauerDauer !== null && a.ausdauerDauer > 0;
      case 'weitereBewegung': return true;
      case 'mahlzeiten': return !!a.mahlzeiten;
      case 'sicherheit': return a.sicherheit.length > 0;
      default: return true;
    }
  }

  function handleNext(){
    if(!isCurrentStepValid()) return;
    lastResults = null;
    goNext();
  }

  /* =========================================================
     EVENTS
  ========================================================= */
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if(!t) return;
    var action = t.getAttribute('data-action');

    if(action === 'start'){ goTo('geschlecht'); return; }
    if(action === 'next'){ handleNext(); return; }
    if(action === 'back'){ goBack(); return; }

    if(action === 'choose'){
      var value = t.getAttribute('data-value');
      if(state.screen === 'geschlecht') setAnswer('geschlecht', value);
      else if(state.screen === 'ziel') setAnswer('ziel', value);
      else if(state.screen === 'arbeitsalltag') setAnswer('arbeitsalltag', value);
      else if(state.screen === 'koerperfett'){
        if(value === 'ja') setAnswer('koerperfettBekannt', true);
        else { setAnswer('koerperfettBekannt', false); setAnswer('koerperfett', null); }
        render();
        return;
      }
      lastResults = null;
      render();
      if(state.screen === 'geschlecht' || state.screen === 'ziel' || state.screen === 'arbeitsalltag'){
        setTimeout(handleNext, 180);
      }
      return;
    }

    if(action === 'choose-krafttraining'){
      setAnswer('krafttraining', parseInt(t.getAttribute('data-value'),10));
      lastResults = null;
      render();
      setTimeout(handleNext, 180);
      return;
    }
    if(action === 'choose-ausdauer'){
      setAnswer('ausdauer', parseInt(t.getAttribute('data-value'),10));
      lastResults = null;
      render();
      setTimeout(handleNext, 180);
      return;
    }
    if(action === 'choose-mahlzeiten'){
      setAnswer('mahlzeiten', t.getAttribute('data-value'));
      lastResults = null;
      render();
      setTimeout(handleNext, 180);
      return;
    }
    if(action === 'chip-schritte'){
      setAnswer('schritte', parseInt(t.getAttribute('data-value'),10));
      render();
      return;
    }
    if(action === 'chip-keine-bewegung'){
      setAnswer('weitereBewegung', 'nein');
      render();
      return;
    }
    if(action === 'toggle-sicherheit'){
      var v = t.getAttribute('data-value');
      var a = state.answers;
      if(v === 'nichts'){
        a.sicherheit = (a.sicherheit.indexOf('nichts') !== -1) ? [] : ['nichts'];
      } else {
        var idx = a.sicherheit.indexOf(v);
        if(idx !== -1) a.sicherheit.splice(idx,1);
        else a.sicherheit = a.sicherheit.filter(function(x){return x!=='nichts';}).concat([v]);
      }
      render();
      return;
    }

    if(action === 'edit'){
      goTo(t.getAttribute('data-step'));
      return;
    }
    if(action === 'edit-general'){
      goTo(STEP_ORDER[0]);
      return;
    }

    if(action === 'calculate'){
      var warnings = getWarnings(state.answers);
      if(warnings.length > 0){
        goTo('warnings');
      } else {
        lastResults = null;
        goTo(hasMedicalFlag(state.answers) ? 'safety' : 'results');
      }
      return;
    }

    if(action === 'warning-confirm'){
      state.resolvedWarnings[t.getAttribute('data-step')] = true;
      var remaining = getWarnings(state.answers);
      if(remaining.length === 0){
        lastResults = null;
        goTo(hasMedicalFlag(state.answers) ? 'safety' : 'results');
      } else {
        render();
      }
      return;
    }
    if(action === 'warning-edit'){
      goTo(t.getAttribute('data-step'));
      return;
    }

    if(action === 'restart'){
      state.answers = {
        geschlecht:null,alter:null,groesse:null,gewicht:null,ziel:null,zielgewicht:null,
        koerperfettBekannt:null,koerperfett:null,arbeitsalltag:null,schritte:null,
        krafttraining:null,krafttrainingDauer:null,ausdauer:null,ausdauerDauer:null,
        weitereBewegung:null,mahlzeiten:null,sicherheit:[]
      };
      state.resolvedWarnings = {};
      lastResults = null;
      goTo('start');
      return;
    }

    if(action === 'save-image'){
      saveResultImage(t);
      return;
    }

    if(action === 'copy-yazio'){
      if(!lastResults) return;
      var text = 'Kalorien: '+lastResults.calorieStart+' kcal\nEiweiß: '+lastResults.proteinGrams+' g\nFett: '+lastResults.fatGrams+' g\nKohlenhydrate: '+lastResults.carbGrams+' g\nBallaststoffe: '+lastResults.fiberGrams+' g\nTrinkmenge: '+lastResults.waterLiters+' l';
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          t.textContent = 'Kopiert ✓';
          t.classList.add('copied');
          setTimeout(function(){ t.textContent = 'Werte kopieren'; t.classList.remove('copied'); }, 2000);
        });
      }
      return;
    }
  });

  render();
})();
</script>
</body>
</html>
